# Two-GPU CI lane: the same Qwen3.8-27B target on one GB200 and the
# Qwen DFlash2 GQA architecture with full attention on the other. This exercises
# block diffusion, full attention, grouped convolutions, and selector loss.
# Reference: https://huggingface.co/z-lab/Qwen3.8-27B-DFlash2/blob/ac04198556d7e8867853cbc356807b969f311b05/config.json
# The draft JSON follows configs/draft_models/kimi_k3_dflash2_mla_swa.json's
# explicit attention-mode and RoPE configuration style.
model:
  target_model_path: Qwen/Qwen3.8-27B
  target_model_backend: vllm
  draft_model_config: configs/ci/qwen3_8_27b_dflash2_draft.json
  embedding_key: model.language_model.embed_tokens.weight
  lm_head_key: lm_head.weight
  norm_key: model.language_model.norm.weight
  trust_remote_code: true

dataset:
  train_data_path: ../../examples/data/sample_conversations.jsonl
  chat_template: qwen
  prompt_key: conversations
  shuffle_dataset: false
  length_group_size: 1
  min_loss_tokens: 32

training:
  attention_backend: flex_attention
  micro_batch_size: 1
  draft_accumulation_steps: 1
  learning_rate: 1e-4
  max_concurrent_batches: 1
  max_grad_norm: 0.5
  # Keep the complete 12,913-token record so DFlash2 is exercised after
  # multiple vLLM chunked-prefill iterations.
  max_seq_length: 16384
  num_epochs: 1
  prefetch_depth: 1
  save_interval: 0
  save_per_epoch: false
  seed: 42
  training_num_gpus_per_node: 1
  training_num_nodes: 1
  warmup_ratio: 0.0
  dflash_block_size: 8
  dflash_num_anchors: 512
  dflash_num_target_layers: 5
  dflash_loss_decay_gamma: 7.0
  dflash2_selector_loss_alpha: 1.0

inference:
  inference_engine_type: vllm
  store_last_hidden_states: false
  inference_num_gpus: 1
  inference_num_gpus_per_engine: 1
  inference_num_gpus_per_node: 2
  inference_batch_size: 1
  inference_buffer_threshold: 2
  max_sample_pool_size: 4
  # Official post-layer IDs, including linear/GDN layers. vLLM captures the
  # decoder residual stream; these must match dflash_config.target_layer_ids.
  aux_hidden_states_layers: [5, 19, 33, 47, 61]
  vllm:
    tp_size: 1
    mem_fraction_static: 0.55
    extra_args:
      enforce_eager: true
      language_model_only: true
      max_model_len: 16384
      max_num_batched_tokens: 4096

mooncake:
  master_server_address: null
  metadata_server: null
  protocol: tcp
  global_segment_size: 4GB
  local_buffer_size: 1GB

output_dir: ""
cache_dir: ../../.ci-cache/qwen3-8-27b-dflash2-smoke
model_download_dir: null

logging:
  report_to: none

debug:
  enable_perf_metrics: true
  save_debug_train_data: null
